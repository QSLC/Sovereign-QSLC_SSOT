name: EVE Daily Repository Audit

on:
  schedule:
    - cron: "0 16 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  issues: read
  actions: read

concurrency:
  group: eve-daily-audit
  cancel-in-progress: false

jobs:
  audit:
    name: Read-only QSLC repository audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate Python syntax and JSON artifacts
        run: |
          python -m py_compile scripts/eve_daily_audit.py
          python -m unittest discover -s tests -v
      - name: Run EVE audit
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python scripts/eve_daily_audit.py
      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eve-daily-audit-${{ github.run_id }}
          path: audit-output/
          if-no-files-found: warn
          retention-days: 30
