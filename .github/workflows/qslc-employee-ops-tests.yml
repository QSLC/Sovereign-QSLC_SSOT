name: QSLC employee operations tests
on:
  pull_request:
    paths:
      - "ops/employee-ops/**"
      - ".github/workflows/qslc-employee-ops-tests.yml"
  push:
    branches: [main]
    paths:
      - "ops/employee-ops/**"
      - ".github/workflows/qslc-employee-ops-tests.yml"
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate public-safe employee template
        run: python ops/employee-ops/validate_employee_config.py ops/employee-ops/employee-config.example.json
      - name: Run unit tests
        run: python -m unittest discover -s ops/employee-ops/tests -v
