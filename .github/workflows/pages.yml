name: Deploy QSLC EVE to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qslc-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Privacy Scanner Regression Tests
        run: npm run privacy:test
      - name: Public Product Contract Tests
        run: npm run public:test
      - name: Governance Contract Tests
        run: npm run governance:test
      - name: Public Projection Validator Tests
        run: npm run contract:test
      - name: Validate Public Projection Fixture
        run: npm run contract:validate
      - name: Deployment Health Unit Tests
        run: npm run deploy:test
      - name: Source Privacy Scan
        run: npm run privacy:scan
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build -- --base /Sovereign-QSLC_SSOT/
      - name: Generate release attestation
        shell: bash
        run: |
          set -euo pipefail
          cat > dist/qslc-release.json <<EOF
          {
            "schema": "qslc.release-attestation.v1",
            "repository": "$GITHUB_REPOSITORY",
            "commit_sha": "$GITHUB_SHA",
            "workflow": "$GITHUB_WORKFLOW",
            "run_id": "$GITHUB_RUN_ID",
            "run_attempt": "$GITHUB_RUN_ATTEMPT",
            "ref": "$GITHUB_REF",
            "canonical_url": "https://qslc-hei.com",
            "source_url": "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/commit/$GITHUB_SHA",
            "run_url": "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID",
            "generated_utc": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF
          find dist -type f ! -path 'dist/qslc-release.sha256' -print0 | sort -z | xargs -0 sha256sum > dist/qslc-release.sha256
      - name: Upload release attestation evidence
        uses: actions/upload-artifact@v4
        with:
          name: qslc-release-attestation-${{ github.sha }}
          path: |
            dist/qslc-release.json
            dist/qslc-release.sha256
          if-no-files-found: error
          retention-days: 90
      - name: Bundle Privacy Scan
        run: npm run privacy:scan:dist
      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages-production
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  smoke:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify deployed GitHub Pages host
        run: node scripts/check-deployment.mjs https://qslc.github.io/Sovereign-QSLC_SSOT/ qslc.github.io
      - name: Verify deployed release attestation
        shell: bash
        run: |
          set -euo pipefail
          url="https://qslc.github.io/Sovereign-QSLC_SSOT/qslc-release.json"
          body="$(curl -L -sS --fail --max-time 30 "$url")"
          echo "$body" | grep -F "\"commit_sha\": \"$GITHUB_SHA\""
          echo "Release attestation matches deployed commit $GITHUB_SHA"
