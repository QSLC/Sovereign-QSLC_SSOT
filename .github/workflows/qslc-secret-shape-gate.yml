name: EVE Secret Shape Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secret-shape:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Reject tracked production env files
        shell: bash
        run: |
          set -euo pipefail
          if git ls-files | grep -Eq '(^|/)\.env\.production$'; then echo '::error::Tracked .env.production is forbidden'; exit 1; fi
      - name: Reuse repository privacy scanner
        run: npm run privacy:scan