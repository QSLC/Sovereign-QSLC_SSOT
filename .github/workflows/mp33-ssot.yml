name: MP-33 private SSOT checks
on:
  pull_request:
    paths: ['services/ssot/**', '.github/workflows/mp33-ssot.yml']
  push:
    branches: [main]
    paths: ['services/ssot/**', '.github/workflows/mp33-ssot.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r services/ssot/requirements.txt httpx==0.28.1
      - run: python -m unittest discover -s services/ssot -v
      - run: docker build -f services/ssot/Dockerfile -t qslc-ssot:ci .
